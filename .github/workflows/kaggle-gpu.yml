# Runs the dmap_vae_kaggle notebooks on Kaggle with GPU T4 x2.
#
# 1. Flattens src/, tests/ and experiments/configs/ with build_kaggle_package.py and
#    uploads the result as a new version of the Kaggle Dataset the notebooks look for
#    under /kaggle/input.
# 2. Pushes each selected notebook as a Kaggle kernel (GPU T4 x2, Internet on)
#    attached to that dataset, waits for it, and stores its output as an artifact.
#
# Required repository secrets: KAGGLE_USERNAME plus either KAGGLE_API_TOKEN
# (new tokens) or KAGGLE_KEY (legacy kaggle.json key).
name: Kaggle GPU notebooks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "build_kaggle_package.py"
      - ".github/workflows/kaggle-gpu.yml"
  workflow_dispatch:
    # One checkbox per notebook: input "nb_<name>" runs tests/ or experiments/<name>.ipynb.
    inputs:
      action:
        description: "run = upload code, push and wait; collect = only fetch status/output of the last run"
        type: choice
        options: [run, collect]
        default: run
      nb_00_checks_kaggle:
        description: "00 · Checks: kernel compile + numerical controls on both T4 (minutes)"
        type: boolean
        default: true
      nb_01a_swiss_beta_sweep_kaggle:
        description: "01a · Swiss roll: label-free beta sweep (10-55 min)"
        type: boolean
        default: false
      nb_01_swiss_kaggle:
        description: "01 · Swiss roll: full experiment with selected beta (15-25 min)"
        type: boolean
        default: false
      nb_02_torus_kaggle:
        description: "02 · Torus: basic run"
        type: boolean
        default: false
      nb_02b_torus_protocolo_kaggle:
        description: "02b · Torus: closing protocol T1-T5 (~5.5 h)"
        type: boolean
        default: false
      nb_03_mnist_kaggle:
        description: "03 · MNIST: basic run"
        type: boolean
        default: false
      nb_03b_mnist_protocolo_kaggle:
        description: "03b · MNIST: closing protocol M1-M4 (~3.5 h)"
        type: boolean
        default: false
      nb_04_alanine_kaggle:
        description: "04 · Alanine: basic run (needs alanine-prepared dataset)"
        type: boolean
        default: false
      nb_04b_alanine_protocolo_kaggle:
        description: "04b · Alanine: closing protocol L1-L5 (~4 h)"
        type: boolean
        default: false
      nb_05_swiss_cierre_kaggle:
        description: "05 · Swiss roll: closing experiments A, B, D (~7 h)"
        type: boolean
        default: false
      nb_06_swiss_latente_kaggle:
        description: "06 · Swiss roll: is the latent the rectangle? (~4.5 h)"
        type: boolean
        default: false
      nb_07_swiss_lambda_kaggle:
        description: "07 · Swiss roll: jac lambda sweep (3-4.5 h)"
        type: boolean
        default: false
      nb_08_swiss_isometria_final_kaggle:
        description: "08 · Swiss roll: final isometry (~3 h)"
        type: boolean
        default: false
      nb_08_swiss_isometria_final_v2_kaggle:
        description: "08 v2 · Swiss roll: isometry + no-DMAP control + grid (2-5 h)"
        type: boolean
        default: false
      nb_09_exportar_figuras_kaggle:
        description: "09 · Figure export (needs 08 v2 output in the same session)"
        type: boolean
        default: false
      nb_11_swiss_oraculo_cuadricula_kaggle:
        description: "11 · Swiss roll: AE + oracle and square grid (~6 h)"
        type: boolean
        default: false
      nb_12_swiss_volumen_kaggle:
        description: "12 · Swiss roll with volume, 3-D chart (~3.5 h)"
        type: boolean
        default: false

concurrency:
  group: kaggle-gpu
  cancel-in-progress: false

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_CLI: kaggle==2.2.4

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          # Empty on push: only the checks notebook runs.
          INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          inputs = json.loads(os.environ["INPUTS"] or "null") or {"nb_00_checks_kaggle": "true"}
          names = sorted(k.removeprefix("nb_") for k, v in inputs.items()
                         if k.startswith("nb_") and str(v).lower() == "true")
          if not names:
              sys.exit("Select at least one notebook.")
          missing = [n for n in names if not any(pathlib.Path(d, f"{n}.ipynb").exists() for d in ("tests", "experiments"))]
          if missing:
              sys.exit(f"Unknown notebooks: {missing}")
          print("notebooks=" + json.dumps(names))
          EOF

  upload:
    needs: plan
    if: github.event.inputs.action != 'collect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "$KAGGLE_CLI"
      - name: Upload code as Kaggle Dataset version
        run: |
          ref="$KAGGLE_USERNAME/dndr-dmap-vae-kaggle"
          pkg=$(python3 build_kaggle_package.py "$RUNNER_TEMP")
          cat > "$pkg/dataset-metadata.json" <<EOF
          {"title": "DNDR dmap_vae_kaggle", "id": "$ref", "licenses": [{"name": "other"}]}
          EOF
          if kaggle datasets status "$ref" >/dev/null 2>&1; then
            kaggle datasets version -p "$pkg" --dir-mode zip -m "${GITHUB_SHA::12}"
          else
            kaggle datasets create -p "$pkg" --dir-mode zip
          fi
          # Kernels pushed before the version is processed would mount the old code.
          for _ in $(seq 60); do
            status=$(kaggle datasets status "$ref" 2>&1 || true)
            echo "dataset: $status"
            case "$status" in *ready*) exit 0;; *error*) exit 1;; esac
            sleep 20
          done
          exit 1

  notebook:
    needs: [plan, upload]
    if: always() && needs.plan.result == 'success' && (needs.upload.result == 'success' || needs.upload.result == 'skipped')
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 h; Kaggle keeps running. Use action=collect afterwards.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # ponytail: one GPU session at a time to stay under Kaggle's concurrent-session quota.
      max-parallel: 1
      matrix:
        notebook: ${{ fromJson(needs.plan.outputs.notebooks) }}
    env:
      NOTEBOOK: ${{ matrix.notebook }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install "$KAGGLE_CLI"
      - name: Kernel id
        run: |
          slug="dndr-$(echo "$NOTEBOOK" | tr '_' '-')"
          echo "KERNEL=$KAGGLE_USERNAME/$slug" >> "$GITHUB_ENV"
          echo "TITLE=$(echo "$slug" | tr '-' ' ')" >> "$GITHUB_ENV"
      - name: Push notebook (GPU T4 x2)
        if: github.event.inputs.action != 'collect'
        run: |
          dir="$RUNNER_TEMP/kernel"
          mkdir -p "$dir"
          cp tests/"$NOTEBOOK.ipynb" "$dir/" 2>/dev/null || cp experiments/"$NOTEBOOK.ipynb" "$dir/"
          cat > "$dir/kernel-metadata.json" <<EOF
          {
            "id": "$KERNEL",
            "title": "$TITLE",
            "code_file": "$NOTEBOOK.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "machine_shape": "NvidiaTeslaT4",
            "enable_internet": true,
            "dataset_sources": ["$KAGGLE_USERNAME/dndr-dmap-vae-kaggle"]
          }
          EOF
          kaggle kernels push -p "$dir" | tee push.log
          # Poll this exact version so a stale "complete" from the previous run is never read.
          version=$(grep -oP 'version \K[0-9]+' push.log | head -1)
          echo "KERNEL_REF=$KERNEL${version:+/$version}" >> "$GITHUB_ENV"
      - name: Wait for Kaggle run
        run: |
          sleep 60
          while true; do
            status=$(kaggle kernels status "${KERNEL_REF:-$KERNEL}" 2>&1 || true)
            echo "$(date -u +%H:%M:%S) $status"
            case "${status,,}" in
              *complete*) exit 0;;
              *error*|*cancel*) exit 1;;
            esac
            sleep 120
          done
      - name: Download output
        if: always()
        run: kaggle kernels output "$KERNEL" -p "out/$NOTEBOOK" -o || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.notebook }}
          path: out/${{ matrix.notebook }}
          if-no-files-found: warn
